name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 推送 gh-pages 分支
  pages: write # 触发 Pages 构建

concurrency:
  group: pages
  cancel-in-progress: false

# 为什么不用 actions/deploy-pages：
# 该 action 的 timeout 有 600000ms 硬上限，而本仓库所在的 Pages 队列实测
# 需要约 9.5 分钟才能完成构建，必然踩线超时（run 31096782830、31100818408
# 均因此失败）。这里改为推送 gh-pages 分支并显式请求构建，然后立刻结束
# workflow —— Pages 在后台自己慢慢构建，不占用 Actions 时间也不受其超时约束。

jobs:
  deploy:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 推送产物到 gh-pages 分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          touch dist/.nojekyll # 关闭 Jekyll 处理
          cd dist
          git init -q -b gh-pages
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "部署 ${SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages

      - name: 请求 Pages 构建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -X POST --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pages/builds"
          echo
          echo "已请求构建。Pages 后台约需 10 分钟，完成后见 https://liutower.github.io/rift-wizard-3-web/"
